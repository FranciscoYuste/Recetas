<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario Digital</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1 class="site-title">
            <img src="img/BannerRecetas.png" alt="Recetario Digital">
        </h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Buscar por título...">
        </div>
        <nav class="categories-bar" id="categoryFilters">
            <button class="active" data-cat="Todas">Todas</button>
            <button data-cat="Carnes">🥩 Carnes</button>
            <button data-cat="Pescados y Mariscos">🐟 Pescados</button>
            <button data-cat="Pastas">🍝 Pastas</button>
            <button data-cat="Ensaladas">🥗 Ensaladas</button>
            <button data-cat="Sopas y Cremas">🍲 Sopas y Cremas</button>
            <button data-cat="Postres">🍰 Postres</button>
        </nav>
    </header>

    <main class="main-layout">
        <section class="recipes-grid" id="recipesGrid"></section>
    </main>

    <!-- Botón Flotante para abrir la Lista de la Compra -->
    <button id="openShoppingBtn" class="floating-shopping-btn">
        🛒 Lista (<span id="cartCount">0</span>)
    </button>

    <!-- Modal de la Lista de la Compra -->
    <div id="shoppingModal" class="modal">
        <div class="modal-content shopping-modal-content">
            <span class="close-btn" id="closeShoppingModal">&times;</span>
            <h2>🛒 Lista de la Compra</h2>
            <p id="shoppingStatus" role="status" aria-live="polite"></p>

            <div class="shopping-workspace">
                <section class="shopping-add-panel" aria-labelledby="shoppingAddTitle">
                    <h3 id="shoppingAddTitle">Añadir productos</h3>
                    <div class="shopping-search-container">
                        <label for="shoppingSearchInput">Buscar producto</label>
                        <input type="search" id="shoppingSearchInput" placeholder="Ej.: tomates, leche..."
                            autocomplete="off">
                        <div id="shoppingSearchResults" class="shopping-search-results"></div>
                    </div>

                    <div id="quantityContainer" class="quantity-container" hidden>
                        <span id="selectedProductName"></span>
                        <input type="number" id="shoppingQuantity" min="1" step="1" value="1" aria-label="Cantidad">
                        <button id="addShoppingItemBtn" class="btn btn-primary">Añadir</button>
                    </div>
                </section>

                <section class="shopping-list-panel" aria-labelledby="shoppingListTitle">
                    <h3 id="shoppingListTitle">Tu lista</h3>
                    <ul id="shoppingList" class="shopping-list"></ul>
                    <button id="clearListBtn" class="btn-clear">Vaciar Lista</button>
                </section>
            </div>
        </div>
    </div>

    <!-- Modal para ver la receta completa -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="modalTitle"></h2>
            <p><span id="modalCategory" class="badge"></span></p>
            <h3>Ingredientes</h3>
            <ul id="modalIngredients"></ul>
            <h3>Pasos de Preparación</h3>
            <div id="modalSteps"></div>
            <p id="modalUrlWrapper" style="margin-top: 15px;"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
